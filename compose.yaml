services:

  ir2:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    working_dir: /app
    volumes:
      - .:/app
      - huggingface_cache:/root/.cache/huggingface
    stdin_open: true
    tty: true

  gpl:
    build:
      context: .
      dockerfile: Dockerfile.gpl
    platform: linux/amd64
    working_dir: /app/gpl
    volumes:
      - .:/app
      - huggingface_cache:/root/.cache/huggingface
    stdin_open: true
    tty: true

volumes:
  huggingface_cache:
