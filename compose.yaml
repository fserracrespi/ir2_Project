services:
  ir2:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: sleep infinity
    volumes:
      - .:/app
      - huggingface_cache:/root/.cache/huggingface
    stdin_open: true
    tty: true

  gpl:
    build:
      context: .
      dockerfile: Dockerfile.gpl
    working_dir: /app/gpl
    command: sleep infinity
    volumes:
      - .:/app
      - huggingface_cache:/root/.cache/huggingface
    stdin_open: true
    tty: true

volumes:
  huggingface_cache: